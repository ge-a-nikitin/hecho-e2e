name: Checks

# Pull-request gate: the static checks, then the suite against a stack built from
# the pinned SUT commit. The suite itself lives in run-suite.yml — the same
# workflow the SUT repository calls for its own pull requests — so this gate
# exercises the code the callers run instead of a copy of it. No Qase token is
# available here, so the run stays offline; publishing happens from `main` in
# qase.yml.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint, types and catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Check out the suite
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check the Qase catalogue against the specs
        run: pnpm qase:check

  suite:
    name: Suite
    # sut-ref stays `pin`: this gate tests the commit the generated context
    # describes, and the provenance stamp on the images refuses anything else.
    uses: ./.github/workflows/run-suite.yml
    permissions:
      contents: read
    with:
      sut-repository: ge-a-nikitin/hecho-demo
      sut-ref: pin
      verify-sut-context: true
      qase-mode: "off"
